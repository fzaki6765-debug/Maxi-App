name: Build Maxi App APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Basic Flutter App Structure
        run: |
          flutter create . --force
          rm -f lib/main.dart

      - name: Create main.dart
        run: |
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MaxiApp());
          }

          class MaxiApp extends StatelessWidget {
            const MaxiApp({super.key});

            @override
            Widget build(Widget context) {
              return MaterialApp(
                title: 'MAXI Stream',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0F0F12),
                  colorScheme: const ColorScheme.dark(primary: Colors.redAccent),
                ),
                home: const MaxiHomeScreen(),
              );
            }
          }

          class MaxiHomeScreen extends StatefulWidget {
            const MaxiHomeScreen({super.key});

            @override
            State<MaxiHomeScreen> createState() => _MaxiHomeScreenState();
          }

          class _MaxiHomeScreenState extends State<MaxiHomeScreen> {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('MAXI - التطبيق الترفيهي'),
                  backgroundColor: Colors.transparent,
                ),
                body: const Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(Icons.tv, size: 80, color: Colors.redAccent),
                      SizedBox(height: 16),
                      Text('تطبيق Maxi جاهز ويعمل بنجاح!', style: TextStyle(fontSize: 20, color: Colors.white)),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Maxi-App-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
